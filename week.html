<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colette — Weekly Schedule</title>
<style>
:root{--paper:#faf6ef;--cream:#f3ead9;--ink:#241d16;--muted:#8a7c68;--line:#e3d7c3;--gold:#c99a3b;--gold-deep:#8a6a1f;--wine:#7c2d3a;--green:#2e7d32}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);padding:16px}
h1{font-size:1.3rem;margin:0}
.bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.nav{display:flex;align-items:center;gap:8px}
.nav button{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-weight:700;cursor:pointer;color:var(--ink)}
.range{font-weight:700;min-width:170px;text-align:center}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:820px;font-size:.86rem}
th,td{border:1px solid var(--line);padding:8px;text-align:center;vertical-align:top}
thead th{background:var(--cream);position:sticky;top:0}
th.today,td.today{background:#fbf4e4}
.name{text-align:left;font-weight:700;white-space:nowrap;background:var(--cream)}
.name .rate{display:block;font-weight:500;color:var(--muted);font-size:.76rem}
.cell{cursor:pointer;min-width:92px}
.cell .shift{font-weight:700;color:var(--gold-deep)}
.cell .off{color:var(--muted)}
.cell.conflict{background:#fdecec}
.cell .warn{color:var(--wine);font-size:.72rem;font-weight:700}
.cell:hover{background:#fbf4e4}
tfoot td{background:var(--cream);font-weight:700}
.rowtot{background:var(--cream);font-weight:700;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:.8rem}
.totals{display:flex;gap:18px;flex-wrap:wrap;margin:12px 2px;font-weight:700}
.totals .k{display:block;color:var(--muted);font-weight:600;font-size:.8rem}
.reqs{margin:14px 0;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px}
.reqs h3{margin:0 0 8px;font-size:1rem}
.req{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding:8px 0}
.req:first-of-type{border-top:none}
.req .acts button{border:1px solid var(--line);border-radius:16px;padding:5px 12px;cursor:pointer;font-weight:700;margin-left:6px}
.req .ok{background:var(--green);color:#fff;border-color:var(--green)}
.req .no{background:none;color:var(--wine)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.ov.on{display:flex}
.ed{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:320px;border:1px solid var(--line)}
.ed h3{margin:0 0 4px} .ed .who{color:var(--muted);font-size:.85rem;margin-bottom:6px}
.ed .warn{color:var(--wine);font-size:.82rem;margin-bottom:10px;font-weight:700}
.ed label{display:block;font-size:.8rem;color:var(--muted);margin:8px 0 3px}
.ed input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:1rem}
.ed .row{display:flex;gap:10px}.ed .row>div{flex:1}
.ed .acts{display:flex;gap:8px;margin-top:16px}
.ed .acts button{flex:1;border-radius:20px;padding:10px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:#fff}
.ed .acts .save{background:var(--gold);border-color:var(--gold);color:#1a1206} .ed .acts .off{color:var(--wine)}
body.readonly .cell{cursor:default}
body.readonly .adminonly{display:none}
.savenote{font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<div class="bar">
  <h1>🗓️ Weekly Schedule</h1>
  <div class="nav">
    <button onclick="shiftWeek(-1)">← Prev</button>
    <span class="range" id="range"></span>
    <button onclick="shiftWeek(1)">Next →</button>
    <button onclick="thisWeek()">This week</button>
  </div>
</div>

<div class="bar" id="tools" style="display:none;gap:8px;flex-wrap:wrap;align-items:center">
  <button onclick="copyLastWeek()">⧉ Copy last week → shown week</button>
  <button onclick="copyToNext()">Copy shown week → next →</button>
  <button onclick="aiFill()">🤖 AI fill from history</button>
  <button onclick="suggestCoverage()">⚖ Check coverage</button>
  <span class="small muted" id="tools-note"></span>
</div>
<div class="reqs adminonly" id="reqs" style="display:none"></div>

<div class="wrap"><table id="grid"></table></div>

<div class="totals">
  <div><span class="k">Week hours</span><span id="tot-hours">0</span></div>
  <div class="adminonly"><span class="k">Week labor</span><span id="tot-pay">$0</span></div>
  <div class="savenote" id="savenote" style="align-self:center"></div>
</div>

<div class="ov" id="ov">
  <div class="ed">
    <h3>Set shift</h3>
    <div class="who" id="ed-who"></div>
    <div class="warn" id="ed-warn" style="display:none"></div>
    <div class="row">
      <div><label>Start</label><input type="time" id="ed-start" value="06:00"></div>
      <div><label>End</label><input type="time" id="ed-end" value="14:00"></div>
    </div>
    <div class="acts">
      <button class="off" onclick="clearShift()">Off</button>
      <button onclick="closeEd()">Cancel</button>
      <button class="save" onclick="saveShift()">Save</button>
    </div>
  </div>
</div>

<script>
const BACKEND='https://colette-app-backend.vercel.app';
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
// Coverage targets by weekday (Mon..Sun). Mon closed. Fri–Sun 3rd person is a short 10a–2p.
const COVER_TARGET=[0,2,2,2,3,3,3];
const THIRD_SHORT={4:['10:00','14:00'],5:['10:00','14:00'],6:['10:00','14:00']};
const DEFAULT_SHIFT=['07:30','16:30'];
const $=id=>document.getElementById(id);
const _params=new URLSearchParams(location.search);
const _role=_params.get('role')||'admin';
const isAdmin=_role==='admin';                 // owner: sees pay, approves time off
const canEdit=(_role==='admin'||_role==='manager'); // owner + Marco/Melissa can edit shifts
const MYPIN=_params.get('pin')||'';             // scheduler's PIN (manager mode saves with this)
const adminKey=()=>{ try{ return localStorage.getItem('colette_admin_key')||''; }catch(e){ return ''; } };
let staff=[], roster={}, shifts={}, timeoff=[], weekStart=mondayOf(new Date()), edKey=null;

function mondayOf(d){ d=new Date(d); const g=(d.getDay()+6)%7; d.setDate(d.getDate()-g); d.setHours(0,0,0,0); return d; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function iso(d){ return d.toISOString().slice(0,10); }
function fmtD(d){ return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function keyOf(n,d){ return n+'|'+d; }
function to12(t){ if(!t) return ''; let [h,m]=t.split(':').map(Number); const ap=h<12?'a':'p'; let hh=h%12; if(hh===0)hh=12; return hh+(m?(':'+String(m).padStart(2,'0')):'')+ap; }
function hoursBetween(a,b){ const [ah,am]=a.split(':').map(Number),[bh,bm]=b.split(':').map(Number); let mins=(bh*60+bm)-(ah*60+am); if(mins<0)mins+=1440; return mins/60; }
function money(n){ return '$'+(Math.round(n)).toLocaleString(); }
function note(t){ const n=$('savenote'); n.textContent=t; setTimeout(()=>n.textContent='',1800); }

function dowLabel(dateISO){ return DOW[(new Date(dateISO+'T12:00:00').getDay()+6)%7]; }
function conflict(name,dateISO){
  if((roster[name]||[]).includes(dowLabel(dateISO))) return 'day off';
  const t=timeoff.find(x=>x.name===name && dateISO>=x.from && dateISO<=(x.to||x.from));
  if(t) return 'time off';
  return null;
}

function allNames(){ const s=new Set((staff||[]).map(p=>p.name)); Object.keys(roster||{}).forEach(n=>s.add(n)); Object.keys(shifts||{}).forEach(k=>s.add(k.split('|')[0])); return [...s]; }
function weekDates(ws){ return DOW.map((_,i)=>iso(addDays(ws,i))); }
function toolsNote(m){ const el=$('tools-note'); if(el) el.textContent=m; }
function copyLastWeek(){
  const dst=weekDates(weekStart), src=weekDates(addDays(weekStart,-7));
  let n=0, skip=0;
  allNames().forEach(name=>{ for(let i=0;i<7;i++){ const sk=keyOf(name,src[i]), dk=keyOf(name,dst[i]); if(shifts[sk]){ if(shifts[dk]){skip++;continue;} shifts[dk]={start:shifts[sk].start,end:shifts[sk].end}; n++; } } });
  if(!n && !skip){ toolsNote('Nothing in last week to copy.'); return; }
  render(); persist(); toolsNote('Copied '+n+' shift(s) from last week'+(skip?(' · kept '+skip+' already set'):'')+' ✓');
}
function copyToNext(){
  const src=weekDates(weekStart), dst=weekDates(addDays(weekStart,7));
  let n=0, skip=0;
  allNames().forEach(name=>{ for(let i=0;i<7;i++){ const sk=keyOf(name,src[i]), dk=keyOf(name,dst[i]); if(shifts[sk]){ if(shifts[dk]){skip++;continue;} shifts[dk]={start:shifts[sk].start,end:shifts[sk].end}; n++; } } });
  if(!n && !skip){ toolsNote('Nothing in the shown week to copy forward.'); return; }
  render(); persist(); toolsNote('Copied '+n+' shift(s) into next week'+(skip?(' · kept '+skip):'')+' ✓ — press Next →'); 
}
// AI: learn each person's most common shift per weekday from all weeks BEFORE the shown week
function aiFill(){
  const cutoff=iso(weekStart);
  const freq={}, weeksSeen={};
  Object.keys(shifts).forEach(k=>{ const idx=k.indexOf('|'); const name=k.slice(0,idx), date=k.slice(idx+1); if(date>=cutoff) return;
    const dow=(new Date(date+'T12:00:00').getDay()+6)%7; const s=shifts[k]; if(!s||!s.start) return;
    freq[name]=freq[name]||{}; freq[name][dow]=freq[name][dow]||{}; const key=s.start+'-'+s.end;
    freq[name][dow][key]=(freq[name][dow][key]||0)+1;
    weeksSeen[name]=weeksSeen[name]||new Set(); weeksSeen[name].add(date.slice(0,7)+'-'+Math.floor(new Date(date+'T12:00:00').getTime()/6048e5)); });
  const dst=weekDates(weekStart); let n=0; let maxWeeks=0;
  allNames().forEach(name=>{ const f=freq[name]; if(!f) return; if(weeksSeen[name]) maxWeeks=Math.max(maxWeeks, weeksSeen[name].size);
    for(let i=0;i<7;i++){ const dk=keyOf(name,dst[i]); if(shifts[dk]) continue; if(conflict(name,dst[i])) continue; const m=f[i]; if(!m) continue;
      let best=null,bc=0; for(const key in m){ if(m[key]>bc){bc=m[key];best=key;} }
      if(best){ const p=best.split('-'); shifts[dk]={start:p[0],end:p[1]}; n++; } } });
  const cov=enforceCoverage(dst, freq);
  render(); persist();
  let msg = n ? ('🤖 AI: filled '+n+' from patterns') : '🤖 AI: no past patterns yet';
  if(cov.added) msg+=', added '+cov.added+' to hit coverage';
  msg += cov.short.length ? (' · ⚠ still short: '+cov.short.join(', ')+' (need to hire/adjust)') : ' · coverage met ✓';
  toolsNote(msg);
}
function currentCount(dateISO){ let c=0; allNames().forEach(nm=>{ if(shifts[keyOf(nm,dateISO)]) c++; }); return c; }
function modalShift(freq,name,i){ const m=freq[name]&&freq[name][i]; if(!m) return null; let best=null,bc=0; for(const k in m){ if(m[k]>bc){bc=m[k];best=k;} } if(!best) return null; const p=best.split('-'); return {start:p[0],end:p[1]}; }
function enforceCoverage(dst, freq){ let added=0; const short=[];
  for(let i=0;i<7;i++){ const tgt=COVER_TARGET[i]||0; if(!tgt) continue; let cnt=currentCount(dst[i]);
    while(cnt<tgt){ let cands=allNames().filter(nm=> !shifts[keyOf(nm,dst[i])] && !conflict(nm,dst[i]));
      if(!cands.length){ short.push(DOW[i]); break; }
      cands.sort((a,b)=> ((freq&&modalShift(freq,b,i))?1:0)-((freq&&modalShift(freq,a,i))?1:0));
      const nm=cands[0]; let sh;
      if(cnt>=2 && tgt>=3 && THIRD_SHORT[i]) sh={start:THIRD_SHORT[i][0],end:THIRD_SHORT[i][1]};
      else sh=(freq&&modalShift(freq,nm,i))||{start:DEFAULT_SHIFT[0],end:DEFAULT_SHIFT[1]};
      shifts[keyOf(nm,dst[i])]=sh; added++; cnt++;
    }
  }
  return {added, short:[...new Set(short)]};
}
// Non-destructive: flag thin days + suggest who to add
function suggestCoverage(){ const dst=weekDates(weekStart); const lines=[];
  for(let i=0;i<7;i++){ const tgt=COVER_TARGET[i]||0; if(!tgt) continue; const cnt=currentCount(dst[i]); if(cnt>=tgt) continue;
    const need=tgt-cnt; const cands=allNames().filter(nm=> !shifts[keyOf(nm,dst[i])] && !conflict(nm,dst[i]));
    const who=cands.slice(0,need).join(', ')||'(no one free — hire/adjust)';
    const slot=(tgt>=3 && THIRD_SHORT[i] && cnt>=2)?' [3rd 10a–2p]':'';
    lines.push(DOW[i]+': +'+need+slot+' → '+who);
  }
  toolsNote(lines.length ? ('⚠ Thin days — '+lines.join(' · ')) : '✓ Coverage target met all week.');
}

function shiftWeek(n){ weekStart=addDays(weekStart,7*n); render(); }
function thisWeek(){ weekStart=mondayOf(new Date()); render(); }

function render(){
  document.body.classList.toggle('readonly',!canEdit);
  const days=DOW.map((_,i)=>addDays(weekStart,i));
  $('range').textContent=fmtD(days[0])+' – '+fmtD(days[6]);
  const todayISO=iso(new Date());
  let head='<thead><tr><th class="name">Staff</th>'+days.map((d,i)=>`<th class="${iso(d)===todayISO?'today':''}">${DOW[i]}<br><span class="muted small">${fmtD(d)}</span></th>`).join('')+'<th class="rowtot">Week</th></tr></thead>';
  let dayH=new Array(7).fill(0), dayN=new Array(7).fill(0), weekHours=0, weekPay=0;
  let body='<tbody>';
  staff.forEach((p)=>{
    let rowHours=0;
    const rate=(typeof p.rate==='number')?p.rate:null;
    body+=`<tr><td class="name">${p.name}${(isAdmin&&rate!=null)?`<span class="rate">$${rate.toFixed(2)}/hr</span>`:''}</td>`;
    days.forEach((d,i)=>{
      const di=iso(d); const sh=shifts[keyOf(p.name,di)]; const conf=conflict(p.name,di);
      let inner='<span class="off">—</span>';
      if(sh){ const h=hoursBetween(sh.start,sh.end); rowHours+=h; dayH[i]+=h; dayN[i]++; inner=`<span class="shift">${to12(sh.start)}–${to12(sh.end)}</span><br><span class="muted small">${h.toFixed(1)}h</span>`; if(conf) inner+=`<br><span class="warn">⚠ ${conf}</span>`; }
      else if(conf){ inner=`<span class="warn">${conf}</span>`; }
      body+=`<td class="cell ${iso(d)===todayISO?'today':''} ${sh&&conf?'conflict':''}" onclick="openEd('${p.name.replace(/'/g,"\\'")}','${di}')">${inner}</td>`;
    });
    const pay=rowHours*(rate||0); weekHours+=rowHours; weekPay+=pay;
    body+=`<td class="rowtot">${rowHours.toFixed(1)}h${(isAdmin&&rate!=null)?`<br><span class="muted small">$${pay.toFixed(0)}</span>`:''}</td></tr>`;
  });
  body+='</tbody>';
  let foot='<tfoot><tr><td class="name">Coverage</td>'+dayH.map((h,i)=>{const tgt=COVER_TARGET[i]||0; const sh=tgt-dayN[i]; const flag= tgt===0 ? '' : (sh>0?`<br><span class="warn">⚠ need ${sh}</span>`:`<br><span class="muted small" style="color:#2e7d32">✓ ${tgt}+</span>`); return `<td>${dayN[i]} ppl<br><span class="muted small">${h.toFixed(1)}h</span>${flag}</td>`;}).join('')+`<td class="rowtot">${weekHours.toFixed(1)}h</td></tr></tfoot>`;
  $('grid').innerHTML=head+body+foot;
  $('tot-hours').textContent=weekHours.toFixed(1)+' h';
  $('tot-pay').textContent=money(weekPay);
}

function openEd(name,dateISO){
  if(!canEdit) return;
  edKey={name,dateISO};
  $('ed-who').textContent=name+' · '+new Date(dateISO+'T00:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
  const conf=conflict(name,dateISO); const w=$('ed-warn');
  if(conf){ w.style.display='block'; w.textContent='⚠ '+name+' is marked '+conf+' this day.'; } else { w.style.display='none'; }
  const sh=shifts[keyOf(name,dateISO)];
  $('ed-start').value=sh?sh.start:'06:00'; $('ed-end').value=sh?sh.end:'14:00';
  $('ov').classList.add('on');
}
function closeEd(){ $('ov').classList.remove('on'); edKey=null; }
async function persist(){
  const headers={'Content-Type':'application/json'};
  const payload={shifts};
  if(isAdmin){ headers['x-colette-secret']=adminKey(); } // owner saves with the admin key
  else { payload.pin=MYPIN; }                             // Marco/Melissa save with their PIN
  try{
    const r=await fetch(BACKEND+'/api/ops?action=shifts-save',{method:'POST',headers,body:JSON.stringify(payload)});
    const d=await r.json().catch(()=>({}));
    note(d.ok?'✓ Saved':(d.error||'Save failed'));
  }catch(e){ note('Save failed'); }
}
function saveShift(){ if(!edKey) return; const s=$('ed-start').value,e=$('ed-end').value; if(!s||!e) return; shifts[keyOf(edKey.name,edKey.dateISO)]={start:s,end:e}; closeEd(); render(); persist(); }
function clearShift(){ if(!edKey) return; delete shifts[keyOf(edKey.name,edKey.dateISO)]; closeEd(); render(); persist(); }

// Admin: pending time-off requests
async function loadRequests(){
  if(!isAdmin) return;
  try{
    const r=await fetch(BACKEND+'/api/ops?action=timeoff-list&t='+Date.now(),{headers:{'x-colette-secret':adminKey()}});
    const d=await r.json().catch(()=>({}));
    if(!d.ok) return;
    const pending=(d.requests||[]).filter(t=>t.status==='pending');
    const box=$('reqs');
    if(!pending.length){ box.style.display='none'; return; }
    box.style.display='block';
    box.innerHTML='<h3>⏳ Time-off requests</h3>'+pending.map(t=>`<div class="req"><div><b>${t.name}</b> · ${t.from}${t.to&&t.to!==t.from?' – '+t.to:''}${t.reason?' · <span class="muted">'+t.reason+'</span>':''}</div><div class="acts"><button class="ok" onclick="resolveReq('${t.id}','approved')">Approve</button><button class="no" onclick="resolveReq('${t.id}','denied')">Deny</button></div></div>`).join('');
  }catch(e){}
}
async function resolveReq(id,status){
  try{ await fetch(BACKEND+'/api/ops?action=timeoff-resolve',{method:'POST',headers:{'Content-Type':'application/json','x-colette-secret':adminKey()},body:JSON.stringify({id,status})}); await loadAll(); }catch(e){}
}

async function loadAll(){
  try{
    const r=await fetch(BACKEND+'/api/ops?action=shifts-get&t='+Date.now());
    const d=await r.json().catch(()=>({}));
    shifts=d.shifts||{}; roster={}; (d.roster||[]).forEach(m=>roster[m.name]=m.daysOff||[]); timeoff=d.timeoff||[];
    staff=(d.roster||[]).map(m=>({name:m.name})); // employee default: names only, no rate
  }catch(e){}
  if(isAdmin){
    try{ const t=await fetch(BACKEND+'/api/ops?action=team-list&t='+Date.now(),{headers:{'x-colette-secret':adminKey()}}); const td=await t.json().catch(()=>({})); if(td.ok&&td.team&&td.team.length) staff=td.team.map(m=>({name:m.name,rate:+m.rate||0})); }catch(e){}
    loadRequests();
  }
  render();
}
$('ov').addEventListener('click',e=>{ if(e.target===$('ov')) closeEd(); });
loadAll();

// show scheduling tools for owner + managers
try{ if(canEdit){ var _tb=document.getElementById('tools'); if(_tb) _tb.style.display='flex'; } }catch(e){}
</script>
</body>
</html>
